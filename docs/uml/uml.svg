text x="776" y="322" xml:space="preserve">+ __str__() : str</text><text x="776" y="345" xml:space="preserve">+ vers_dict() : dict</text><rect x="40" y="570" width="570" height="272" fill="white" stroke="#222" stroke-width="1.3"/><text x="325.0" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Quiz</text><path d="M40 614 H610" stroke="#222" stroke-width="1"/><text x="56" y="646" xml:space="preserve">+ herbier: Herbier</text><text x="56" y="669" xml:space="preserve">+ questions: list[Question]</text><text x="56" y="692" xml:space="preserve">+ reponses: list[str]</text><path d="M40 705 H610" stroke="#222" stroke-width="1"/><text x="56" y="737" xml:space="preserve">+ __init__(herbier: Herbier)</text><text x="56" y="760" xml:space="preserve">+ preparer(nombre: int=5, famille: str | None=None) :</text><text x="56" y="783" xml:space="preserve">    list[Question]</text><text x="56" y="806" xml:space="preserve">+ repondre(reponse: str) : bool</text><text x="56" y="829" xml:space="preserve">+ resultat() : dict</text><rect x="760" y="570" width="570" height="180" fill="white" stroke="#222" stroke-width="1.3"/><text x="1045.0" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Question</text><path d="M760 614 H1330" stroke="#222" stroke-width="1"/><text x="776" y="646" xml:space="preserve">+ plante: Plante</text><text x="776" y="669" xml:space="preserve">+ choix: list[str]</text><path d="M760 682 H1330" stroke="#222" stroke-width="1"/><text x="776" y="714" xml:space="preserve">+ __init__(plante: Plante, choix: list[str])</text><text x="776" y="737" xml:space="preserve">+ verifier(reponse: str) : bool</text><path d="M40 922 H1330" stroke="#aaa"/><text x="40" y="950" font-family="Arial,sans-serif" font-size="15">LÉGENDE   1 : exactement un objet   ·   0..* : zéro à plusieurs objets</text><text x="40" y="978" font-family="Arial,sans-serif" font-size="15">Trait plein + flèche ouverte : association navigable vers la classe cible ; nombre côté cible = multiplicité.</text><text x="40" y="1006" font-family="Arial,sans-serif" font-size="15">+ : public   ·   # : protégé   ·   Chaque classe : nom / attributs / opérations.</text></g></svg>